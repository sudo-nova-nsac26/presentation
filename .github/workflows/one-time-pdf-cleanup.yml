name: One-time PDF editorial cleanup
on:
  push:
    branches:
      - fix/remove-presentation-editorial-note
    paths:
      - .github/workflows/one-time-pdf-cleanup.yml
permissions:
  contents: write
jobs:
  correct-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF editor
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.5
      - name: Remove submission-form reminder in slide seven
        run: |
          python - <<'PY'
          import os
          import fitz
          path = "Surface Signal - Presentation.pdf"
          tmp = path + ".tmp"
          doc = fitz.open(path)
          assert len(doc) == 7, "Expected exactly 7 slides"
          text = "Review all disclosures in the submission form."
          page = doc[6]
          rectangles = page.search_for(text)
          assert len(rectangles) == 1, f"Expected one editorial reminder; found {len(rectangles)}"
          bg = (5 / 255, 7 / 255, 15 / 255)
          for rect in rectangles:
              page.add_redact_annot(rect, fill=bg)
          page.apply_redactions(images=0, graphics=0, text=0)
          doc.save(tmp, garbage=4, deflate=True)
          doc.close()
          os.replace(tmp, path)
          check = fitz.open(path)
          all_text = "\n".join(p.get_text() for p in check)
          assert len(check) == 7 and text not in all_text
          assert "AI assistance: code and text preparation; mascot image." in all_text
          assert "Municipality of Lajeado (2026)" in all_text
          print("Verified: seven slides retained, editorial reminder removed, disclosure retained.")
          PY
      - name: Commit corrected PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Surface Signal - Presentation.pdf"
          git diff --cached --quiet && { echo "PDF was not changed"; exit 1; }
          git commit -m "fix: remove editorial reminder from presentation PDF"
          git push origin HEAD:fix/remove-presentation-editorial-note
